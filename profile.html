<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chromokiz Profile</title>

    <link rel="icon" href="./images/favicon.ico ">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../styles/css/steamBacklog.css">
</head>

<body>

</body>

<body class="bg-secondary-subtle">
    <nav class="navbar bg-primary mb-4">
        <div class="container">
            <a class="navbar-brand" href="./index.html">
                <img src="../images/Logo v1.png" alt="Logo" width="30" height="24"
                    class="d-inline-block align-text-top">
            </a>
            <div class="justify-content-end"><a href="./profile.html">
                    <p class="text-black">Profile</p>
                </a></div>
        </div>
    </nav>

    <div class="container" id="app">

        <div class="container text-start pb-3 mb-4 border border-2 py-3 rounded bg-light">
            <div class="row g-3">
                <div class="col-md-4">
                    <img src="./images/test-images/testUserProfileIcon.png"
                        class="w-50 mx-auto d-block rounded rounded-3" alt="Factorio's Steam Cover">
                </div>

                <div class="col-md-8 d-flex flex-column justify-content-evenly">
                    <div class="row">
                        <div class="col-sm-12">
                            <p class="fs-4">testUser</p>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-sm-6">
                            <div class="row">
                                <p class="fs-4">Total Playtime:</p>
                            </div>
                            <div class="row">
                                <p class="fs-5">523 Hrs</p>
                            </div>
                        </div>
                        <div class="col-sm-6">
                            <div class="row">
                                <p class="fs-4">Currently Playing:</p>
                            </div>
                            <div class="row">
                                <p class="fs-5">Stardew Valley</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>


        <form class="d-flex" role="search">
            <input class="form-control me-2" type="search" placeholder="Search Your Reviews" aria-label="Search" />
            <button class="btn btn-success" type="submit">Search</button>
        </form>

        <div v-for="review in reviewList">
            <div v-if="review.userID === '123123123123123123'"
                :class="{'container':true, 'pb-3':true, 'my-4':true, 'rounded':true, 'border':true, 'border-opacity-50':true, 'border-danger': !review.finished, 'border-success': review.finished, 'py-3':true, 'px-1':true, 'bg-danger-subtle': !review.finished, 'bg-success-subtle': review.finished}">
                <div class="offset-1">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <p class="fs-4">{{review.gameName}} Review</p>
                        </div>
                        <div class="col-md-6">
                            <p class="fs-4"></i>
                                <i class="bi bi-star-fill ms-1" v-for="n in review.ratingNumber"></i>
                                <i class="bi bi-star ms-1" v-for="n in (review.ratingNumber-5)*-1"
                                    v-if="(review.ratingNumber-5)*-1"></i>
                            </p>
                        </div>
                    </div>
                    <div class="row g-3">
                        <div class="col-md-6  d-none d-md-block">
                            <div class="row">
                                <p class="fs-5">Hours Played:</p>
                            </div>
                            <div class="row">
                                <p class="fs-6">{{review.hours}}</p>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="row">
                                <p class="fs-5">{{review.finished ? "Finished by" : "Reason for Aborting"}}</p>
                            </div>
                            <div class="row">
                                <div class="col-md-auto">
                                    <p class="px-2 py-1 fs-6 rounded-pill bg-info d-inline-block"
                                        v-for="userReasons in review.reasons">{{userReasons}}</p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="mt-2 pe-md-5">
                        <div class="row" v-if="!review.editing">
                            <p class="fs-4">Final Thoughts:</p>
                            <p class="fs-6">{{review.review}}</p>
                            <div class="d-flex justify-content-end">
                                <p class="p-2"><i class="bi bi-trash-fill pointer" @click="removeItem(review)"></i></p>
                                <p class="p-2"><i class="bi bi-pencil-fill pointer" @click="review.editing = !review.editing, editingReview = review.review"></i></p>
                            </div>
                        </div>

                        <form class="row" @submit.prevent="editReview(review)" v-if="review.editing">
                            <p class="fs-4">Edit Your Thoughts:</p>
                            <textarea name="editReview" v-model="editingReview">{{editingReview}}</textarea>
                            <div class="mt-2 justify-content-end d-flex">
                                <button type="submit" class="btn btn-primary mx-2" >Submit</button>
                                <button type="button" class="btn btn-danger" @click="review.editing = !review.editing">Cancel</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    </div>

    <script type="module">

        import app from './js/app.js';

        app.mount('#app');

    </script>

</html>
